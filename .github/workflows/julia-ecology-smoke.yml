name: Julia ecology smoke checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ecology:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13.1'
      - name: Dependencies
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Julia layer boundaries
        run: |
          julia --startup-file=no --project=. test/herbivore_policy.jl
          julia --startup-file=no --project=. test/lw_policy.jl
          julia --startup-file=no --project=. test/memory_blocks.jl
          julia --startup-file=no --project=. test/layer_dependencies.jl
          julia --startup-file=no --project=. test/shared_world_policies.jl
      - name: Root entry help
        run: julia --startup-file=no run.jl --help
      - name: LW completion prediction reward
        run: |
          julia --startup-file=no --project=. experiments/julia_migration/lw_integrated/mb_return_outlook_checks.jl
          julia --startup-file=no --project=. experiments/julia_migration/lw_integrated/h_reward_checks.jl
          julia --startup-file=no --project=. experiments/julia_migration/lw_integrated/home_rest_reward_checks.jl
          julia --startup-file=no --project=. experiments/julia_migration/lw_integrated/embedded_rest_checks.jl
          julia --startup-file=no --project=. experiments/julia_migration/lw_integrated/night_fear_checks.jl
          julia --startup-file=no --project=. experiments/julia_migration/lw_integrated/daily_delivery_checks.jl
          julia --startup-file=no --project=. experiments/julia_migration/lw_integrated/camp_safe_zone_checks.jl
          julia --startup-file=no --project=. experiments/julia_migration/lw_integrated/mb_transfer_checks.jl
      - name: Herbivore and predator checks
        run: |
          julia --startup-file=no --project=. experiments/numeric_ecology/predator-cpu/checks.jl
          julia --startup-file=no --project=. experiments/numeric_ecology/predator-cpu/predator_checks.jl
