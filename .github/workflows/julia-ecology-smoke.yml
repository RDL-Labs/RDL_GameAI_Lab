name: Julia regression checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [boundaries, food, social, portable, navigation, observation, animals, wildlife]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13.1'
      - name: Dependencies
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Run regression suite
        run: julia --startup-file=no --project=. test/ci/run.jl ${{ matrix.suite }}
      - name: Preserve individual test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: julia-${{ matrix.suite }}-logs
          path: outputs/ci/${{ matrix.suite }}/
          if-no-files-found: warn
