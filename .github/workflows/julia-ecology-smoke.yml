name: Julia ecology smoke checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ecology:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13.1'
      - name: Dependencies
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Julia layer boundaries
        run: |
          julia --startup-file=no --project=. test/herbivore_policy.jl
          julia --startup-file=no --project=. test/lw_policy.jl
          julia --startup-file=no --project=. test/memory_blocks.jl
          julia --startup-file=no --project=. test/layer_dependencies.jl
          julia --startup-file=no --project=. test/shared_world_policies.jl
      - name: Root entry help
        run: julia --startup-file=no run.jl --help
      - name: Typed food, personal stores and barter
        run: |
          julia --startup-file=no --project=. experiments/food_exchange/checks.jl
          julia --startup-file=no --project=. experiments/food_exchange/policy_checks.jl
          julia --startup-file=no --project=. experiments/social_relationships/checks.jl
          julia --startup-file=no --project=. experiments/social_relationships/aid_forecast_checks.jl
          julia --startup-file=no --project=. experiments/social_relationships/relational_memory_checks.jl
          julia --startup-file=no --project=. experiments/social_relationships/approach_checks.jl
          julia --startup-file=no --project=. experiments/social_relationships/integration_checks.jl
      - name: Portable non-food world operations
        run: |
          julia --startup-file=no --project=. experiments/portable_items/checks.jl
          julia --startup-file=no --project=. experiments/portable_items/integration_checks.jl
          julia --startup-file=no --project=. experiments/portable_items/incidental_policy_checks.jl
          julia --startup-file=no --project=. experiments/portable_items/incidental_cost_checks.jl
          julia --startup-file=no --project=. experiments/portable_items/incidental_integration_checks.jl
          julia --startup-file=no --project=. experiments/portable_items/social_checks.jl
          julia --startup-file=no --project=. experiments/portable_items/counter_checks.jl
          julia --startup-file=no --project=. experiments/portable_items/exchange_memory_checks.jl
          julia --startup-file=no --project=. experiments/portable_items/quantity_gradient_checks.jl
          julia --startup-file=no --project=. experiments/portable_items/necessity_checks.jl
          julia --startup-file=no --project=. experiments/portable_items/social_integration_checks.jl
      - name: LW completion prediction reward
        run: |
          julia --startup-file=no --project=. experiments/julia_migration/lw_integrated/mb_return_outlook_checks.jl
          julia --startup-file=no --project=. experiments/julia_migration/lw_integrated/h_reward_checks.jl
          julia --startup-file=no --project=. experiments/julia_migration/lw_integrated/home_rest_reward_checks.jl
          julia --startup-file=no --project=. experiments/julia_migration/lw_integrated/embedded_rest_checks.jl
          julia --startup-file=no --project=. experiments/julia_migration/lw_integrated/night_fear_checks.jl
          julia --startup-file=no --project=. experiments/julia_migration/lw_integrated/daily_delivery_checks.jl
          julia --startup-file=no --project=. experiments/julia_migration/lw_integrated/camp_safe_zone_checks.jl
          julia --startup-file=no --project=. experiments/julia_migration/lw_integrated/mb_transfer_checks.jl
      - name: Herbivore and predator checks
        # Includes coarse/fine boundary fields and physical collision regression.
        run: julia --startup-file=no --project=. experiments/julia_migration/lw_integrated/rho_opening_checks.jl
      - name: Herbivore and predator behavior checks
        run: |
          julia --startup-file=no --project=. experiments/numeric_ecology/predator-cpu/checks.jl
          julia --startup-file=no --project=. experiments/numeric_ecology/predator-cpu/predator_checks.jl
