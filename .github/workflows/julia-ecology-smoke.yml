name: Julia optional regression checks
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Feature suite (behavior and legacy checks; not mandatory on every change)
        type: choice
        default: all
        options: [all, boundaries, food, social, portable, navigation, observation, animals, wildlife]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(inputs.suite == 'all' && '["boundaries","food","social","portable","navigation","observation","animals","wildlife"]' || format('["{0}"]', inputs.suite)) }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13.1'
      - name: Dependencies
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Run regression suite
        run: julia --startup-file=no --project=. test/ci/run.jl ${{ matrix.suite }}
      - name: Preserve individual test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: julia-${{ matrix.suite }}-logs
          path: outputs/ci/${{ matrix.suite }}/
          if-no-files-found: warn
