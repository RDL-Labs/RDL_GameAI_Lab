name: Human and ecology 60 days
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrated:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13.1'
      - uses: julia-actions/cache@v2
      - name: Dependencies
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Integrated 60 days
        run: julia --startup-file=no --project=. experiments/lw_wildlife/human_ecology_dual60.jl outputs/human-ecology60 20261008 20261113
      - name: Preserve records and final checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-ecology60-${{ github.run_id }}
          path: |
            outputs/human-ecology60/*.json
            outputs/human-ecology60/run/*.json
            outputs/human-ecology60/run/*.jsonl
            outputs/human-ecology60/run/checkpoints/day-060.jls
          retention-days: 14
