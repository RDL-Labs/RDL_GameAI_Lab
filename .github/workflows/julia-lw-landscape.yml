name: Julia LW Riparian landscape integration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13.1'
      - name: Locked Julia environment
        run: julia --startup-file=no --project=experiments/julia_migration/julia experiments/julia_migration/julia/setup.jl
      - name: Riparian landscape and life
        run: julia --startup-file=no --project=experiments/julia_migration/julia experiments/julia_migration/lw_integrated/landscape_checks.jl outputs/julia-lw-landscape
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: julia-lw-landscape
          path: outputs/julia-lw-landscape
          retention-days: 14
