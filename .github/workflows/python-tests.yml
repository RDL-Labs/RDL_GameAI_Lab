name: Python Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run runtime and v2.3 acquisition tests
        run: python -m unittest discover -s tests -v

  godot-verticals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Godot 4.7.2
        run: |
          curl -L --fail --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Run priority Godot and HTTP verticals
        env:
          GODOT_BIN: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
        run: |
          python -m unittest -v \
            tests.test_experience_godot.GodotExperienceTests.test_safety_vertical_uses_normal_cli_startup \
            tests.test_experience_godot.GodotExperienceTests.test_safety_failure_enters_world_owned_incapacitation \
            tests.test_experience_godot.GodotExperienceTests.test_other_agent_discovers_incapacitation_only_inside_bounded_view \
            tests.test_experience_godot.GodotExperienceTests.test_rescue_goal_delivers_to_safe_place_without_recovery \
            tests.test_experience_godot.GodotExperienceTests.test_rescue_vertical_uses_normal_cli_startup \
            tests.test_experience_godot.GodotExperienceTests.test_three_real_food_cycles_enable_autonomy_without_seed_results \
            tests.test_experience_godot.GodotExperienceTests.test_food_safety_vertical_uses_normal_cli_startup \
            tests.test_experience_godot.GodotExperienceTests.test_continuous_life_interrupt_experience_and_autonomy \
            tests.test_experience_godot.GodotExperienceTests.test_food_rest_vertical_uses_normal_cli_startup \
            tests.test_experience_godot.GodotExperienceTests.test_workbench_visualization_is_observational_only
