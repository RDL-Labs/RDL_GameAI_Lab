<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>軽量World · 記録再生</title>
<style>body{margin:0;background:#101b26;color:#e0e9ef;font:15px system-ui}header,section{padding:18px 24px}h1{font-size:24px;margin:0 0 8px}button,select,input{font:inherit}button,select{background:#223649;color:#fff;border:1px solid #537089;border-radius:5px;padding:7px;margin:4px}#seek{width:100%}main{display:grid;grid-template-columns: minmax(400px,2fr) minmax(280px,1fr)}canvas{width:100%;background:#142735}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px monospace}#status{color:#f3ca83}.muted{color:#9eafbd}@media(max-width:800px){main{display:block}}</style>
<header><h1>軽量World · 記録再生</h1><div class="muted">読取専用 — 再生速度は実験結果を変更しません。H・canonical Sleepは未接続。</div><p><button id="demo">保存済み3日を開く</button> <input id="file" type="file" accept=".jsonl,.gz"><span id="status">ログを選択してください</span></p>
<button id="play">再生</button><button id="step">1観測進む</button><button id="reset">先頭</button><select id="speed"><option value="1">1倍</option><option value="4">4倍</option><option value="16" selected>16倍</option><option value="64">64倍</option></select>
<select id="view"><option value="world">実験者用全景</option><option value="agent">個体の現在取得情報</option></select><select id="agent"><option>npc_a</option><option>npc_b</option><option>npc_c</option></select><input id="seek" type="range" min="0" max="0" value="0"><div id="time"></div></header>
<main><section><canvas id="canvas" width="900" height="650"></canvas><p id="legend"></p></section><section><h2>取得・選択・実結果</h2><pre id="detail"></pre><p class="muted">個体表示は当該packetの身体相対情報のみ。全景の地図・資源残量・真の位置は使いません。表示は離散状態で、移動を補間しません。</p></section></main>
<script src="replay.js"></script><script src="viewer.js"></script></html>
